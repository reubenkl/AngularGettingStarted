<div class="card product-card">
    <div class="card-header">
        {{pageTitle}}
    </div>
    <div class="card-body">
        <div class="row">
            <div class="cl-md-2">Filter by : </div>
            <div class="cl-md-4">
                <input type="text"
                [(ngModel)] = 'listFilter'>
            </div>
        </div>
        <div class="row">
            <div class="cl-md-6" *ngIf='listFilter'>
                <h4>Filtered by :- {{listFilter}}</h4>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table" *ngIf='products.length'>
                <thead>
                    <tr>
                        <th>
                            <button class="btn btn-primary" (click)='toggleImage()'>
                                {{showImage ? 'Hide' : 'Show'}} Image
                            </button>
                        </th>
                        <th>Product</th>
                        <th>Code</th>
                        <th>Available</th>
                        <th>Price</th>
                        <th>5 Star Rating</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor='let product of filteredProducts'>
                        <td>
                            <img *ngIf='showImage' 
                                [src]='product.imageUrl'
                                [title]='product.productName | uppercase'
                                [style.width.px]='imageWidth'
                                [style.margin.px]='imageMargin'>
                        </td>
                        <td>
                            <a [routerLink]="['/products',product.productId]">
                                {{product.productName}}
                            </a>
                        </td>
                        <td>{{product.productCode | lowercase | convertToSpaces:'-'}}</td>
                        <td>{{product.releaseDate}}</td>
                        <td>{{product.price | currency:'INR': 'symbol':'1.2-2'}}</td>
                        <td><pm-star [rating]='product.starRating'
                                    (ratingClicked) = 'OnRatingClicked($event)'
                            ></pm-star></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div>
    <ng-container>
        <mat-button-toggle-group>
            <mat-button-toggle class="split-button-2">Button 2</mat-button-toggle>
            <mat-button-toggle class="split-button-2 drop-down-button" [matMenuTriggerFor]="dropdownMenuTwo">
              <mat-icon>arrow_drop_down</mat-icon>
            </mat-button-toggle>
        </mat-button-toggle-group>
          
        <mat-menu #dropdownMenuTwo="matMenu">
            <button mat-menu-item>One</button>
            <button mat-menu-item>Two</button>
            <button mat-menu-item>Three</button>
        </mat-menu>
    </ng-container>
</div>

<div class="split-button-container">
    <ng-container>
        <button
            mat-stroked-button
            type="button"
            class="found-button"
        >
            <div class="inside-button">
                <span class="found">
                    {{ "Found" }}
                </span>
                <span class="chevron-button">
                    <mat-icon fontIcon="keyboard_arrow_down" id="chevron">V</mat-icon>
                </span>
            </div>
        </button>
    </ng-container>
</div>
